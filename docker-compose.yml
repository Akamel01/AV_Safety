version: "3.8"

services:
  # Development shell — full project access
  dev:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: av-safety-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    command: tail -f /dev/null

  # Risk Quantification API
  risk-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: av-safety-api
    ports:
      - "9000:8000"
    volumes:
      - ./src:/app/src
      - ./deploy/docker-entrypoint.sh:/app/docker-entrypoint.sh
    environment:
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["api"]

  # Portfolio UI
  portfolio-ui:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: av-safety-ui
    ports:
      - "3000:80"
    volumes:
      - ./single-scenario-demo:/app/ui
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docs:/app/docs
    environment:
      - ENVIRONMENT=development

  # Nginx reverse proxy (unified entry)
  nginx:
    image: nginx:alpine
    container_name: av-safety-nginx
    ports:
      - "9080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./single-scenario-demo:/usr/share/nginx/html
      - ./docs:/usr/share/nginx/docs
    depends_on:
      - risk-api
